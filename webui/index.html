<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Speakers</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111114; --muted: #6b6f76; --card: #f2f3f5; --panel: #ffffff;
    --divider: #eef0f2; --press: #e8eaee; --row-press: #f6f7f8; --input-border: #d6d9de;
    --track-off: #e3e5e9; --track-on: #111114; --thumb-bg: #ffffff; --thumb-border: #d6d9de;
    --primary-bg: #111114; --primary-ink: #ffffff;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #08080a; --ink: #e1e3e7; --muted: #8b8f97; --card: #141517; --panel: #1e1f23;
    --divider: #26272b; --press: #2a2b30; --row-press: #232428; --input-border: #33353a;
    --track-off: #2a2b30; --track-on: #e1e3e7; --thumb-bg: #26272b; --thumb-border: #3a3c42;
    --primary-bg: #e1e3e7; --primary-ink: #111114;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Helvetica Neue", system-ui, sans-serif; transition: background .3s, color .3s; }
  .shell { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; display: flex; flex-direction: column; gap: 24px; }
  .wordmark { text-align: center; font-size: 17px; font-weight: 700; letter-spacing: 0.24em; padding: 8px 0; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px; transition: background .3s; }
  .card-head { display: flex; justify-content: space-between; align-items: center; }
  .card-label { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted); }
  .pill { font-size: 14px; font-weight: 600; color: var(--ink); background: var(--panel); border: none; border-radius: 999px; padding: 12px 20px; cursor: pointer; font-family: inherit; }
  .pill:active { background: var(--press); }
  .theme-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 0; }

  .speaker { align-items: center; gap: 16px; padding: 28px 24px; }
  .speaker-name { font-size: 22px; font-weight: 700; }
  .speaker-sources { font-size: 14px; color: var(--muted); margin-top: 6px; text-align: center; }
  .speaker-sources .on { color: var(--ink); font-weight: 600; }
  #sources { display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 10px; color: var(--muted); }
  #sources span { display: flex; width: 26px; height: 26px; align-items: center; justify-content: center; transition: color .3s; }
  #sources svg { display: block; }
  .transport { display: flex; gap: 14px; align-items: center; justify-content: center; }
  .t-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--panel); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); padding: 0; }
  .t-btn:active { background: var(--press); }
  .t-main { width: 64px; height: 64px; }

  .chip { display: flex; align-items: center; gap: 7px; background: var(--panel); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #b0b4bb; }
  .dot.on { background: #1fa653; }

  .panel { background: var(--panel); border-radius: 14px; padding: 20px 18px; display: flex; flex-direction: column; gap: 20px; transition: background .3s; }
  .slider-row { display: flex; flex-direction: column; gap: 2px; }
  .slider-head { display: flex; justify-content: space-between; align-items: baseline; }
  .slider-head b { font-size: 15px; font-weight: 600; }
  .slider-head span { font-size: 14px; color: var(--muted); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--track, var(--track-off)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--thumb-bg); border: 1px solid var(--thumb-border); box-shadow: 0 2px 6px rgba(0,0,0,.18); margin-top: -12px; }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track, var(--track-off)); }
  input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--thumb-bg); border: 1px solid var(--thumb-border); box-shadow: 0 2px 6px rgba(0,0,0,.18); }

  .skins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .skin-tile { border: 2px solid transparent; border-radius: 14px; background: var(--panel); padding: 8px; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; gap: 8px; }
  .skin-tile.active { border-color: var(--ink); }
  .skin-tile span { font-size: 13px; font-weight: 600; color: var(--ink); text-align: center; }
  .skin-preview { height: 52px; border-radius: 9px; position: relative; overflow: hidden; }
  .sp-classic { background: linear-gradient(100deg, #ffffff 49.8%, #0a0a0c 50.2%); border: 1px solid #d6d9de; }
  .sp-classic::after { content: "12:04"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; background: linear-gradient(100deg, #111114 49.8%, #e1e3e7 50.2%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sp-terminal { background: #071208; }
  .sp-terminal::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, transparent 0 2px, rgba(0,0,0,.4) 2px 4px); }
  .sp-terminal::after { content: "12:04"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, monospace; font-size: 17px; color: #3dff7c; text-shadow: 0 0 6px rgba(61,255,124,.7); }
  .sp-neon { background: linear-gradient(160deg, #07020f, #150732); }
  .sp-neon::after { content: "12:04"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; color: #00e5ff; text-shadow: 0 0 8px rgba(0,229,255,.8), 0 0 16px rgba(255,45,120,.5); }
  .sp-retrotv { background: #0a0c10; }
  .sp-retrotv::before { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 6px; background: linear-gradient(90deg, #c8c8c8 0 14%, #c8c832 0 28%, #32c8c8 0 42%, #32c832 0 57%, #c832c8 0 71%, #c83232 0 85%, #3232c8 0 100%); opacity: .8; }
  .sp-retrotv::after { content: "12:04"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, monospace; font-size: 17px; color: #f4f6f2; text-shadow: -1.5px 0 rgba(255,70,70,.6), 1.5px 0 rgba(70,200,255,.6); }

  .net-list { background: var(--panel); border-radius: 14px; padding: 4px 0; display: flex; flex-direction: column; transition: background .3s; }
  .net-row { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 6px 18px; cursor: pointer; border: none; background: none; font-family: inherit; text-align: left; width: 100%; color: inherit; }
  .net-row:active { background: var(--row-press); }
  .net-row + .net-row { border-top: 1px solid var(--divider); }
  .net-name { font-size: 15px; }
  .net-name.muted { color: var(--muted); }
  .net-sub { font-size: 12px; font-weight: 600; color: #1fa653; margin-top: 2px; }
  .net-icons { display: flex; align-items: center; gap: 10px; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
  .modal h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .modal input { font-size: 16px; padding: 13px 14px; border: 1px solid var(--input-border); border-radius: 12px; font-family: inherit; width: 100%; background: var(--panel); color: var(--ink); }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .btn-join { background: var(--primary-bg); color: var(--primary-ink); border: none; border-radius: 999px; padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-cancel { background: none; border: none; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; padding: 12px; font-family: inherit; }
  .modal .note { font-size: 12px; color: var(--muted); margin: 0; }

  @media (min-width: 900px) {
    .shell { max-width: 960px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: stretch; padding-top: 40px; }
    .wordmark { grid-column: 1 / -1; font-size: 20px; letter-spacing: 0.26em; }
    .card.wifi { grid-column: 1 / -1; }
    .speaker { justify-content: center; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="wordmark" style="position: relative">PI&nbsp;SPEAKERS
    <button class="theme-btn" id="themeBtn" aria-label="Display theme"></button>
  </div>

  <div class="card speaker">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#9aa0a8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="3" width="10" height="18" rx="2.5"></rect>
      <circle cx="12" cy="14.5" r="3.2"></circle>
      <circle cx="12" cy="7.5" r="1.2"></circle>
    </svg>
    <div style="text-align:center">
      <div class="speaker-name">Pi Speakers</div>
      <div class="speaker-sources" id="sources"></div>
      <div class="speaker-sources" id="nowPlaying" style="color: var(--ink); display: none"></div>
    </div>
    <div class="transport" id="transport" style="display: none">
      <button class="t-btn" id="prevBtn" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6z"></path><path d="M20 5v14L9.5 12z"></path></svg></button>
      <button class="t-btn t-main" id="playBtn" aria-label="Play or pause"></button>
      <button class="t-btn" id="nextBtn" aria-label="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2z"></path><path d="M4 5v14L14.5 12z"></path></svg></button>
    </div>
    <div class="chip"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="card-label">EQUALISER</span>
      <button class="pill" id="resetBtn">Reset</button>
    </div>
    <div class="panel">
      <div class="slider-row">
        <div class="slider-head"><b>Bass</b><span id="bassVal">0 dB</span></div>
        <input type="range" id="bass" min="-10" max="10" step="1" value="0">
      </div>
      <div class="slider-row">
        <div class="slider-head"><b>Treble</b><span id="trebleVal">0 dB</span></div>
        <input type="range" id="treble" min="-10" max="10" step="1" value="0">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="card-label">DISPLAY THEME</span></div>
    <div class="skins" id="skins">
      <button class="skin-tile" data-skin="classic"><span class="skin-preview sp-classic"></span><span>Classic</span></button>
      <button class="skin-tile" data-skin="terminal"><span class="skin-preview sp-terminal"></span><span>Terminal</span></button>
      <button class="skin-tile" data-skin="neon"><span class="skin-preview sp-neon"></span><span>Neon</span></button>
      <button class="skin-tile" data-skin="retrotv"><span class="skin-preview sp-retrotv"></span><span>Retro TV</span></button>
    </div>
  </div>

  <div class="card wifi">
    <div class="card-head">
      <span class="card-label">WI-FI</span>
      <button class="pill" id="scanBtn">Scan</button>
    </div>
    <div class="net-list" id="netList"><div class="hint" style="padding:18px">Loading networks…</div></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Join network</h2>
    <input type="text" id="ssidInput" placeholder="Network name" autocomplete="off">
    <input type="password" id="pskInput" placeholder="Password">
    <p class="note">If the speaker switches networks, this page may go offline for a moment — reconnect to the same network to find it again.</p>
    <p class="note" id="joinMsg" style="display:none"></p>
    <div class="actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-join" id="joinBtn">Join</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const strengthColor = (s) => s >= 70 ? '#2f9e5f' : s >= 45 ? '#d19a2f' : s >= 20 ? '#d1583a' : '#9aa0a8';
const wifiSvg = (color) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"><path d="M5 12.5a10 10 0 0 1 14 0"></path><path d="M8.5 15.5a5.5 5.5 0 0 1 7 0"></path><circle cx="12" cy="18.5" r="1" fill="${color}" stroke="none"></circle></svg>`;
const lockSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa0a8" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>`;
const plusSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa0a8" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>`;

const themeIcons = {
  auto: '<svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path></svg>',
  light: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"></path></svg>',
  dark: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>',
};
const themeOrder = ['auto', 'light', 'dark'];
let themeState = 'auto';

function resolvedTheme() {
  if (themeState !== 'auto') return themeState;
  const hour = new Date().getHours();
  return (hour >= 21 || hour < 7) ? 'dark' : 'light';
}

function applyTheme() {
  document.documentElement.dataset.theme = resolvedTheme();
  $('themeBtn').innerHTML = themeIcons[themeState];
  $('themeBtn').title = 'Display theme: ' + themeState;
}

$('themeBtn').addEventListener('click', async () => {
  themeState = themeOrder[(themeOrder.indexOf(themeState) + 1) % themeOrder.length];
  applyTheme();
  await fetch('/api/theme', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ mode: themeState }) }).catch(() => {});
});

async function loadTheme() {
  try { themeState = (await (await fetch('/api/theme')).json()).mode; } catch {}
  applyTheme();
}

function paintSlider(input) {
  const pct = ((+input.value + 10) / 20) * 100;
  const lo = Math.min(50, pct), hi = Math.max(50, pct);
  input.style.setProperty('--track',
    `linear-gradient(to right, var(--track-off) 0 ${lo}%, var(--track-on) ${lo}% ${hi}%, var(--track-off) ${hi}% 100%)`);
  $(input.id + 'Val').textContent = (+input.value > 0 ? '+' : '') + input.value + ' dB';
}

let eqTimer;
function pushEq() {
  clearTimeout(eqTimer);
  eqTimer = setTimeout(() => fetch('/api/eq', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bass: +$('bass').value, treble: +$('treble').value }),
  }).catch(() => {}), 250);
}

for (const id of ['bass', 'treble']) {
  $(id).addEventListener('input', () => { paintSlider($(id)); pushEq(); });
}

$('resetBtn').addEventListener('click', () => {
  $('bass').value = 0; $('treble').value = 0;
  paintSlider($('bass')); paintSlider($('treble')); pushEq();
});

async function loadEq() {
  try {
    const eq = await (await fetch('/api/eq')).json();
    $('bass').value = eq.bass; $('treble').value = eq.treble;
    paintSlider($('bass')); paintSlider($('treble'));
    $('statusDot').classList.add('on'); $('statusText').textContent = 'Online';
  } catch {
    $('statusText').textContent = 'Offline';
  }
}

const SOURCES = [
  ['airplay', 'AirPlay 2', 'var(--ink)', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5A2.5 2.5 0 0 1 3 14V6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5V14a2.5 2.5 0 0 1-2 2.45"></path><path d="M12 14.5 17 20H7z" fill="currentColor" stroke="none"></path></svg>'],
  ['spotify', 'Spotify', '#1eb954', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M7.5 9.8c3-.8 6.3-.4 9 1.2"></path><path d="M8 12.8c2.4-.6 5-.3 7.2 1"></path><path d="M8.5 15.6c1.9-.5 3.9-.2 5.6.8"></path></svg>'],
  ['bluetooth', 'Bluetooth', '#3d7ec9', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8 17.5 16.5 12 20.5V3.5L17.5 7.5 6.5 16"></path></svg>'],
];

function renderSources(active) {
  $('sources').innerHTML = SOURCES
    .map(([key, name, color, icon]) =>
      `<span title="${name}"${key === active ? ` style="color: ${color}"` : ''}>${icon}</span>`)
    .join('');
}

const playSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>';
const pauseSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7z"></path><path d="M13.5 5H17v14h-3.5z"></path></svg>';

async function loadNowPlaying() {
  try {
    const now = await (await fetch('/api/now')).json();
    const line = $('nowPlaying');
    if (now.playing && now.title) {
      line.textContent = now.title + (now.artist ? ' — ' + now.artist : '');
      line.style.display = '';
    } else {
      line.style.display = 'none';
    }
    renderSources(now.playing ? now.source : null);

    const controllable = now.source === 'airplay' && now.title;
    $('transport').style.display = controllable ? '' : 'none';
    if (controllable) $('playBtn').innerHTML = now.playing ? pauseSvg : playSvg;
  } catch {}
}

async function sendControl(action) {
  await fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action }) }).catch(() => {});
  setTimeout(loadNowPlaying, 500);
}

$('prevBtn').addEventListener('click', () => sendControl('previous'));
$('playBtn').addEventListener('click', () => sendControl('playpause'));
$('nextBtn').addEventListener('click', () => sendControl('next'));

function netRow(net) {
  const row = document.createElement('button');
  row.className = 'net-row';
  row.innerHTML = `
    <span>
      <span class="net-name">${net.ssid.replace(/</g, '&lt;')}</span>
      ${net.connected ? '<div class="net-sub">Connected</div>' : ''}
    </span>
    <span class="net-icons">${net.secured && !net.connected ? lockSvg : ''}${wifiSvg(strengthColor(net.signal))}</span>`;
  if (!net.connected) row.addEventListener('click', () => openModal(net.ssid, net.secured));
  return row;
}

async function loadWifi(rescan) {
  $('scanBtn').textContent = 'Scanning…';
  try {
    const data = await (await fetch('/api/wifi' + (rescan ? '?rescan=1' : ''))).json();
    const list = $('netList');
    list.innerHTML = '';
    for (const net of data.networks.slice(0, 8)) list.appendChild(netRow(net));

    const other = document.createElement('button');
    other.className = 'net-row';
    other.innerHTML = `<span class="net-name muted">Other network…</span>${plusSvg}`;
    other.addEventListener('click', () => openModal('', true, true));
    list.appendChild(other);
  } catch {
    $('netList').innerHTML = '<div class="hint" style="padding:18px">Couldn’t load networks.</div>';
  }
  $('scanBtn').textContent = 'Scan';
}

function openModal(ssid, secured, editableSsid) {
  $('modalTitle').textContent = editableSsid ? 'Join network' : `Join “${ssid}”`;
  $('ssidInput').value = ssid;
  $('ssidInput').style.display = editableSsid ? '' : 'none';
  $('pskInput').value = '';
  $('pskInput').style.display = secured ? '' : 'none';
  $('joinMsg').style.display = 'none';
  $('overlay').classList.add('open');
}

$('cancelBtn').addEventListener('click', () => $('overlay').classList.remove('open'));

$('joinBtn').addEventListener('click', async () => {
  const ssid = $('ssidInput').value.trim();
  if (!ssid) return;
  $('joinBtn').textContent = 'Joining…';
  try {
    const result = await (await fetch('/api/wifi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ssid, psk: $('pskInput').value }),
    })).json();
    if (result.ok) {
      $('overlay').classList.remove('open');
      loadWifi(false);
    } else {
      $('joinMsg').textContent = result.message || 'Couldn’t join that network.';
      $('joinMsg').style.display = '';
    }
  } catch {
    $('joinMsg').textContent = 'The speaker went offline — if it joined the new network, reconnect and reload.';
    $('joinMsg').style.display = '';
  }
  $('joinBtn').textContent = 'Join';
});

renderSources(null);
function markSkin(skin) {
  for (const tile of $('skins').children) tile.classList.toggle('active', tile.dataset.skin === skin);
}

async function loadSkin() {
  try { markSkin((await (await fetch('/api/skin')).json()).skin); } catch {}
}

for (const tile of $('skins').children) {
  tile.addEventListener('click', async () => {
    markSkin(tile.dataset.skin);
    await fetch('/api/skin', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify({ skin: tile.dataset.skin }) }).catch(() => {});
  });
}

applyTheme();
loadTheme();
loadSkin();
setInterval(applyTheme, 60000);
loadEq();
loadWifi(false);
loadNowPlaying();
setInterval(loadNowPlaying, 10000);
</script>
</body>
